name: Importar jogos do Parke

# Roda só quando alguém clica em "Run workflow". Copia capas e jogos do
# Parke Games para este repositório e depois publica o site.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: importar-parke
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gravar capas e jogos no repositório
      actions: write    # disparar a publicação no fim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (versão fixa)
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pillow==11.3.0"

      - name: Importar
        run: python scripts/importar_parke.py

      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/projetos jogos 2>/dev/null || git add data assets/projetos
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Importa jogos do Parke Games"
          git push

      - name: Publicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
