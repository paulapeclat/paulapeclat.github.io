name: Publicar site de projetos

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar o site a partir de data/projetos.json
        run: python scripts/gerar_site.py

      - name: Separar só o que vai pro ar
        run: |
          mkdir -p _site
          cp -r index.html sitemap.xml robots.txt google*.html favicon.ico assets livros apede lista-de-espera primeiro-obby _site/
          if [ -d jogos ]; then cp -r jogos _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
