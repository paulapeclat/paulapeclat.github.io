name: Publicar site de projetos

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # o histórico dá a data de cada código do livro

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Gerar o site a partir de data/projetos.json
        run: python scripts/gerar_site.py

      - name: Gerar a página dos códigos do livro do obby
        run: python scripts/gerar_codigos_obby.py

      - name: Separar só o que vai pro ar
        run: |
          mkdir -p _site
          cp -r index.html sitemap.xml robots.txt google*.html favicon.ico assets livros apede lista-de-espera primeiro-obby transcrever _site/
          # vitrine desligada (data/projetos.json → vitrine_ativa: false): jogos e capas dos alunos não vão ao ar
          if [ "$(cat .vitrine-ativa)" = "1" ]; then
            if [ -d jogos ]; then cp -r jogos _site/; fi
          else
            rm -rf _site/assets/projetos
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
